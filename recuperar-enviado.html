<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enlace enviado — AgendaLetric</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>

<div class="auth-shell">
  <section class="auth-visual">
    <div class="brand"><span class="brand-mark"><img src="assets/logo-icon.png" alt=""></span><span class="brand-name">AgendaLetric</span></div>
    <div>
      <h1>Revisa tu correo</h1>
      <p>Sigue el enlace que enviamos para crear una nueva contraseña.</p>
    </div>
    <p class="auth-quote">El estado de éxito confirma visualmente que la acción se completó.</p>
  </section>

  <section class="auth-form-side">
    <div class="auth-card">
      <div class="brand"><span class="brand-mark"><img src="assets/logo-icon.png" alt=""></span><span class="brand-name">Agenda<span>Letric</span></span></div>

      <div class="state-banner state-success">
        <span>✅</span>
        <div>
          <strong>Enlace enviado</strong>
          <p style="margin:2px 0 0;">Revisa tu bandeja de entrada para continuar con el cambio de contraseña.</p>
        </div>
      </div>
      <a class="btn btn-secondary btn-block" href="login.html">Volver a iniciar sesión</a>
    </div>
  </section>
</div>

</body>
</html>
